name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Verify & Package APK for Release
        id: prepare_apk
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::File $SOURCE_APK tidak ditemukan! Batalkan pembuatan Release."
            exit 1
          fi

          TAG_NAME="${{ github.ref_name }}"
          APK_NAME="PinkCat-Manager-${TAG_NAME}-debug.apk"
          mkdir -p dist
          cp "$SOURCE_APK" "dist/${APK_NAME}"

          FILE_SIZE=$(stat -c%s "dist/${APK_NAME}" 2>/dev/null || stat -f%z "dist/${APK_NAME}")
          echo "APK Berhasil disiapkan: dist/${APK_NAME} (${FILE_SIZE} bytes)"

          echo "apk_path=dist/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_filename=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Attach APK Asset
        uses: softprops/action-gh-release@v2
        with:
          name: "PinkCat Manager ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          body: |
            # 🐱 PinkCat Manager ${{ github.ref_name }}

            Aplikasi utilitas Android bertema kucing pink untuk memeriksa informasi perangkat dan izin aplikasi nyata.

            ### 📱 Download File APK:
            Langsung unduh file APK dari bagian **Assets** di bawah:
            👉 **[${{ steps.prepare_apk.outputs.apk_filename }}](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.prepare_apk.outputs.apk_filename }})**

            ### ✨ Fitur Unggulan:
            - 📱 **Device Information**: CPU, RAM, Penyimpanan internal, Baterai, Jaringan Wi-Fi/Seluler, Bluetooth, dan Layar dari API resmi.
            - 🔐 **Permission Status**: Audit izin sensitif (Kamera, Mikrofon, Lokasi, Notifikasi) secara legal dan transparan.
            - 📦 **Installed Apps Management**: Jelajahi seluruh aplikasi terpasang, detail target SDK, waktu instalasi, dan launcher activity.
            - 🔎 **Pencarian & Filter**: Pencarian instan dan filter kategori (Semua, Berizin, Pengguna, Sistem).
            - 🛡️ **Pemeriksaan Keamanan**: Status kunci layar, opsi pengembang, USB debugging, dan status Google Play Protect.
            - 🌸 **Cute Modern UI**: Desain Material 3 pastel pink, rounded card, maskot kucing pink, dan Dark Mode penuh.

            ### 📲 Petunjuk Instalasi di Android:
            1. Download file **${{ steps.prepare_apk.outputs.apk_filename }}** di atas.
            2. Buka file APK di perangkat Android Anda.
            3. Jika muncul konfirmasi *"Install unknown apps"*, pilih **Izinkan untuk sumber ini**.
            4. PinkCat Manager siap digunakan secara 100% offline dan aman!
